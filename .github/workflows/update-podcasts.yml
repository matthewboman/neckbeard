name: Update podcast feeds

on:
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Refresh RSS data
        run: npm run update

      - name: Commit changed podcast data
        run: |
          if git diff --quiet -- data/podcasts.json; then
            echo "No podcast changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/podcasts.json
          git commit -m "Update podcast feeds"
          git push
